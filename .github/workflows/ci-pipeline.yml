name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up JDK 17 (Temurin distribution)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Cache Maven dependencies for faster builds
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Check code style using Checkstyle
      - name: Check code style
        run: mvn checkstyle:check

      # Build and test with code coverage using JaCoCo
      - name: Build and test with coverage
        run: mvn verify jacoco:report

      # Security scan with OWASP Dependency-Check
      - name: Security scan
        run: mvn org.owasp:dependency-check-maven:check

      # Upload JaCoCo coverage report for further analysis
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      # Optionally upload the Maven build artifact (JAR/WAR)
      - name: Upload build artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: my-spring-boot-app
          path: target/*.jar
